# Smoke scene: Duck UI HUD over an empty camera viewport.
entities:
  - id: camera
    displayName: Main Camera
    transform:
      position: { x: 0, y: 2, z: 6 }
    components:
      cameraPerspective:
        fov: 60
        near: 0.1
        far: 1000

  - id: hud
    displayName: HUD Root
    transform2d:
      position: { x: 0.02, y: 0.02 }
      size: { x: 0.28, y: 0.14 }
      zIndex: 10
    components:
      uiView:
        bindings:
          title: Duck UI
          hp: 0.75
        document:
          type: panel
          props:
            background: "rgba(15, 23, 42, 0.75)"
            padding: "10px"
            radius: "8px"
          children:
            - type: column
              props:
                gap: "6px"
              children:
                - type: text
                  props:
                    bind: title
                    fontSize: "16px"
                    color: "#e2e8f0"
                - type: progress
                  props:
                    bind: hp
                    label: HP
                    color: "#4ade80"
